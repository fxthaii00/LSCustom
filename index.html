<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Angel — Mon espace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="wrap">
    <header style="border-bottom:none;justify-content:space-between;align-items:center;">
      <div>
        <div class="section-tag">Espace</div>
        <h1 class="page-title">Mon <em>compte</em></h1>
      </div>
      <div class="header-tools">
        <div class="user-pill">
          <img class="user-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=default" alt="avatar">
          <span id="headerUserName">Chargement...</span>
        </div>
        <button id="logoutBtn" class="header-logout-btn" type="button">Déconnexion</button>
      </div>
    </header>

    <div class="table-card auth-card">
      <p class="page-desc" id="welcomeMessage" style="margin:0 0 18px;">Chargement de votre espace...</p>
      <button class="btn primary" type="button" onclick="window.location.href='login.html'">Retour à la connexion</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
